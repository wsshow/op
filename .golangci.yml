# golangci-lint configuration for github.com/wsshow/op
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  modules-download-mode: readonly
  go: "1.25"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - gocritic
    - gosec
    - nilerr
    - prealloc
    - unconvert
    - unparam
    - wastedassign
    - errorlint
    - makezero
    - predeclared

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/wsshow/op
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
      - opinionated
  gosec:
    excludes:
      - G104 # errcheck handles this
  errcheck:
    check-blank: false
  staticcheck:
    checks: ["all"]

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    # Process manager must execute external commands (G204)
    - path: process/
      linters:
        - gosec
      text: "G204"
    # Waiting queue size bounded by memory, safe int->int32 conversion
    - path: workerpool/
      linters:
        - gosec
      text: "G115"
    # Options struct (160 bytes) passed by value is intentional API design
    - path: process/
      linters:
        - gocritic
      text: "hugeParam"
    - path: op\.go
      linters:
        - gocritic
      text: "hugeParam"
  max-issues-per-linter: 0
  max-same-issues: 0
